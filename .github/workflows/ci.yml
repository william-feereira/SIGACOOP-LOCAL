name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: siga_test, POSTGRES_USER: siga, POSTGRES_PASSWORD: siga }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siga -d siga_test" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-only-secret
      POSTGRES_DB: siga_test
      POSTGRES_USER: siga
      POSTGRES_PASSWORD: siga
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - run: pytest --cov=apps --cov-report=term-missing
      - name: Checagem de segurança de produção
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-production-check-key-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: siga.exemplo.local

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
