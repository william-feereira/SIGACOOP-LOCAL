# /etc/nginx/sites-available/siga — substitua siga.exemplo.local e os caminhos do certificado.
limit_req_zone $binary_remote_addr zone=siga_login:10m rate=10r/m;

server {
    listen 80;
    server_name siga.exemplo.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siga.exemplo.local;
    ssl_certificate     /etc/ssl/siga/siga.crt;
    ssl_certificate_key /etc/ssl/siga/siga.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ { alias /opt/siga-coop/staticfiles/; expires 7d; }

    # Arquivos privados: só saem depois que o Django confere a permissão (X-Accel-Redirect).
    location /protegido/ { internal; alias /opt/siga-coop/private_media/; }

    location /contas/entrar/ {
        limit_req zone=siga_login burst=5 nodelay;
        include /etc/nginx/siga-proxy.conf;
    }

    location / { include /etc/nginx/siga-proxy.conf; }
}
