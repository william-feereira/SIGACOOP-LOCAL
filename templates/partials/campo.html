<div class="campo{% if campo.errors %} campo-erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="obrigatorio" aria-hidden="true">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<p class="ajuda" id="{{ campo.id_for_label }}_ajuda">{{ campo.help_text }}</p>{% endif %}
  {% for erro in campo.errors %}<p class="erro" id="{{ campo.id_for_label }}_erro" role="alert">{{ erro }}</p>{% endfor %}
</div>
